name: Build C safe UI diagnostic

on:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/build-c-safe-ui.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore pristine native library
        run: |
          git fetch origin main
          git show origin/main:universal/lib/arm64-v8a/libdrastic_arm64.so > universal/lib/arm64-v8a/libdrastic_arm64.so

      - name: Restore safe config class and add only UI scale fields
        run: |
          git show origin/main:universal/smali/f0/h.smali > universal/smali/f0/h.smali
          python3 -c "from pathlib import Path; p=Path('universal/smali/f0/h.smali'); s=p.read_text(); s=s.replace('.field public static D0:Z = false\\n','.field public static D0:Z = false\\n\\n.field public static Hires3DScale:I = 0x1\\n',1); s=s.replace('.field public static V0:Z = false\\n','.field public static V0:Z = false\\n\\n.field public static Hires3DScaleGame:I = 0x1\\n',1); p.write_text(s)"
          grep -q 'Hires3DScale:I = 0x1' universal/smali/f0/h.smali
          grep -q 'Hires3DScaleGame:I = 0x1' universal/smali/f0/h.smali

      - name: Build APK
        run: |
          java -jar apktool.jar b universal -o DraStic_C_SAFE_UI_TEST.apk

      - name: Sign and verify
        run: |
          java -jar uber-apk-signer.jar --apks DraStic_C_SAFE_UI_TEST.apk --overwrite --verbose
          java -jar uber-apk-signer.jar --apks DraStic_C_SAFE_UI_TEST.apk --onlyVerify --verbose
          sha256sum DraStic_C_SAFE_UI_TEST.apk > DraStic_C_SAFE_UI_TEST.sha256

      - name: Upload C diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: DraStic-C-safe-UI-test
          path: |
            DraStic_C_SAFE_UI_TEST.apk
            DraStic_C_SAFE_UI_TEST.sha256
