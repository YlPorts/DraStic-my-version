name: Install ARM64 multi-scale HiRes patch

on:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/apply-hires-multiscale-arm64.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install AArch64 binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Assemble verified patch
        run: |
          cat > /tmp/hires_scale_patch.S <<'ASM'
          .text
          .global patch_start
          patch_start:
              // adrp x13, 0x14c000 at VA 0x1cdf4
              .inst 0x9000098d
              ldr x13, [x13, #1128]
              ubfx x1, x13, #51, #2
              cmp w10, w1
              b.eq patch_end
              mov w10, w0
              add w13, w1, #1
              lsl w11, w13, #8
              add w12, w13, w13, lsl #1
              lsl w12, w12, #6
              add x9, x9, #0x968
              mov w15, #1
              add x8, x8, x10, lsl #2
              str w11, [x8, #2424]
              str w12, [x8, #2432]
              str w1, [x9]
              str w15, [x8, #2416]
          patch_end:
              ret
          ASM
          aarch64-linux-gnu-as /tmp/hires_scale_patch.S -o /tmp/hires_scale_patch.o
          aarch64-linux-gnu-objcopy -j .text -O binary /tmp/hires_scale_patch.o /tmp/hires_scale_patch.bin
          test "$(stat -c%s /tmp/hires_scale_patch.bin)" = "72"

      - name: Patch installed ARM64 library
        run: |
          mkdir -p analysis
          python3 tools/patch_hires_scale_arm64.py \
            universal/lib/arm64-v8a/libdrastic_arm64.so \
            /tmp/hires_scale_patch.bin \
            /tmp/libdrastic_arm64.so \
            | tee analysis/native_patch_installed.txt
          test "$(sha256sum /tmp/libdrastic_arm64.so | awk '{print $1}')" = "3667b5ec89f3cef1c7a7eb29f22dc6e13b892a9e9f58434e3d371c51cbfdda69"
          mv /tmp/libdrastic_arm64.so universal/lib/arm64-v8a/libdrastic_arm64.so

      - name: Verify installed disassembly
        run: |
          aarch64-linux-gnu-objdump -d \
            --start-address=0x1cde4 --stop-address=0x1ce3c \
            universal/lib/arm64-v8a/libdrastic_arm64.so \
            | tee -a analysis/native_patch_installed.txt
          grep -q "adrp.*x13, 14c000" analysis/native_patch_installed.txt
          grep -q "ubfx.*x1, x13, #51, #2" analysis/native_patch_installed.txt
          grep -q "lsl.*w11, w13, #8" analysis/native_patch_installed.txt
          grep -q "lsl.*w12, w12, #6" analysis/native_patch_installed.txt

      - name: Commit patched library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal/lib/arm64-v8a/libdrastic_arm64.so analysis/native_patch_installed.txt
          git commit -m "Install ARM64 1x-4x internal 3D resolution patch"
          git push
