name: Dump renderer fixed-size block

on:
  workflow_dispatch:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/dump-renderer-fixed-block.yml'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Dump
        run: |
          aarch64-linux-gnu-objdump -d --start-address=0x1ce40 --stop-address=0x1d6c0 universal/lib/arm64-v8a/libdrastic_arm64.so | tee /tmp/renderer-fixed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-fixed-block
          path: /tmp/renderer-fixed.txt
