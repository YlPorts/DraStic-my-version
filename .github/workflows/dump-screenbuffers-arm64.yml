name: Dump ARM64 screen buffer paths

on:
  workflow_dispatch:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/dump-screenbuffers-arm64.yml'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Dump patched and pristine screen paths
        run: |
          git fetch origin main
          git show origin/main:universal/lib/arm64-v8a/libdrastic_arm64.so > /tmp/original.so
          echo '===== PATCHED getScreenBuffers 0x19068-0x19640 ====='
          aarch64-linux-gnu-objdump -d --start-address=0x19068 --stop-address=0x19640 universal/lib/arm64-v8a/libdrastic_arm64.so
          echo '===== ORIGINAL getScreenBuffers 0x19068-0x19640 ====='
          aarch64-linux-gnu-objdump -d --start-address=0x19068 --stop-address=0x19640 /tmp/original.so
          echo '===== PATCHED getScreenshot 0x19640-0x19830 ====='
          aarch64-linux-gnu-objdump -d --start-address=0x19640 --stop-address=0x19830 universal/lib/arm64-v8a/libdrastic_arm64.so
          echo '===== PATCHED buffer helpers 0x1cd18-0x1ce40 ====='
          aarch64-linux-gnu-objdump -d --start-address=0x1cd18 --stop-address=0x1ce40 universal/lib/arm64-v8a/libdrastic_arm64.so
