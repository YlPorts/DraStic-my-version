name: Dump Q HiRes plane callers

on:
  workflow_dispatch:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/dump-q-plane-callers.yml'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AArch64 binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Dump callers and plane storage
        run: |
          SO=universal/lib/arm64-v8a/libdrastic_arm64.so
          aarch64-linux-gnu-objdump -d "$SO" > /tmp/full-q-plane.txt
          {
            echo '===== caller of 5fb8c 0x55200-0x55980 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x55200 --stop-address=0x55980 "$SO"
            echo
            echo '===== surrounding plane/storage functions 0x5f240-0x5fb90 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x5f240 --stop-address=0x5fb90 "$SO"
            echo
            echo '===== core row conversion entry 0x4c5c0-0x4cc70 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x4c5c0 --stop-address=0x4cc70 "$SO"
            echo
            echo '===== xrefs to polygon/span renderer 0x55220 ====='
            grep -nE 'bl[[:space:]]+55220|b[[:space:]]+55220' /tmp/full-q-plane.txt -B 28 -A 44 || true
            echo
            echo '===== xrefs to low-level span writer 0x5fb8c ====='
            grep -nE 'bl[[:space:]]+5fb8c|b[[:space:]]+5fb8c' /tmp/full-q-plane.txt -B 28 -A 44 || true
            echo
            echo '===== xrefs to planar line getter 0x5f9f4 ====='
            grep -nE 'bl[[:space:]]+5f9f4|b[[:space:]]+5f9f4' /tmp/full-q-plane.txt -B 28 -A 44 || true
            echo
            echo '===== likely renderer dispatch 0x52c00-0x55240 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x52c00 --stop-address=0x55240 "$SO"
            echo
            echo '===== plane/pass renderer 0x59000-0x59f40 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x59000 --stop-address=0x59f40 "$SO"
            echo
            echo '===== xrefs to pass renderer 0x590xx range ====='
            grep -nE 'bl[[:space:]]+59[0-9a-f]{3}|b[[:space:]]+59[0-9a-f]{3}' /tmp/full-q-plane.txt -B 16 -A 24 | head -n 2200 || true
          } | tee /tmp/q-plane-callers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q-plane-callers
          path: /tmp/q-plane-callers.txt
