name: Dump FX render ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/dump-fx-render-arm64.yml'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Dump FX render
        run: |
          {
            echo '===== JNI wrappers 0x18e80-0x19040 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x18e80 --stop-address=0x19040 universal/lib/arm64-v8a/libdrastic_arm64.so
            echo '===== render functions 0x1cb00-0x1d100 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x1cb00 --stop-address=0x1d100 universal/lib/arm64-v8a/libdrastic_arm64.so
          } | tee /tmp/fxrender.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fxrender-arm64
          path: /tmp/fxrender.txt
