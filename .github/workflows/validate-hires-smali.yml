# Full ARM64 1x-4x validation trigger
name: Validate internal-resolution branch APK

on:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/validate-hires-smali.yml'
      - 'universal/smali/f0/h.smali'
      - 'universal/smali/com/dsemu/drastic/ui/Settings.smali'
      - 'universal/res/**'
      - 'universal/lib/arm64-v8a/libdrastic_arm64.so'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apktool-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebuild APK with apktool
        run: |
          java -jar apktool.jar b universal -o DraStic_internal_resolution_test_unsigned.apk

      - name: Record successful rebuild
        continue-on-error: true
        run: |
          mkdir -p analysis
          {
            echo "# Internal resolution branch build validation"
            echo
            echo "Result: SUCCESS"
            echo "Commit: $GITHUB_SHA"
            echo "APK size: $(stat -c%s DraStic_internal_resolution_test_unsigned.apk) bytes"
            echo "APK SHA-256: $(sha256sum DraStic_internal_resolution_test_unsigned.apk | awk '{print $1}')"
            echo "Generated (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > analysis/build_validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/build_validation.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record internal resolution APK build validation"
            git pull --rebase origin feature/internal-resolution-scaling
            git push
          fi

      - name: Upload rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: DraStic-internal-resolution-test-unsigned
          path: DraStic_internal_resolution_test_unsigned.apk
