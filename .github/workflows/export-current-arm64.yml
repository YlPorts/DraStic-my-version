name: Export current ARM64 library

on:
  workflow_dispatch:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/export-current-arm64.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: current-arm64-library
          path: universal/lib/arm64-v8a/libdrastic_arm64.so
