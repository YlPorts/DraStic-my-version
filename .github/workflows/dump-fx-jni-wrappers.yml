name: Dump FX JNI wrappers

on:
  workflow_dispatch:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/dump-fx-jni-wrappers.yml'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Dump JNI wrappers
        run: |
          aarch64-linux-gnu-objdump -d --start-address=0x18e80 --stop-address=0x19068 universal/lib/arm64-v8a/libdrastic_arm64.so | tee /tmp/fx-jni.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fx-jni-wrappers
          path: /tmp/fx-jni.txt
