name: Inspect ARM64 HiRes auxiliary buffers

on:
  workflow_dispatch:
  push:
    branches:
      - feature/internal-resolution-scaling
    paths:
      - '.github/workflows/inspect-hires-aux-buffers.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
      - name: Inspect
        run: |
          {
            echo '===== renderer setup 0x3c800-0x3cd80 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x3c800 --stop-address=0x3cd80 universal/lib/arm64-v8a/libdrastic_arm64.so
            echo '===== texture/FBO setup 0x203c0-0x20690 ====='
            aarch64-linux-gnu-objdump -d --start-address=0x203c0 --stop-address=0x20690 universal/lib/arm64-v8a/libdrastic_arm64.so
            echo '===== xrefs/candidates around fixed sizes ====='
            aarch64-linux-gnu-objdump -d universal/lib/arm64-v8a/libdrastic_arm64.so | grep -E '60000|c0000|180000|300000|200000|400000|#0x180|#0x200|#0x300|#0x400' | head -n 600
          } | tee /tmp/hires-aux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hires-aux-inspection
          path: /tmp/hires-aux.txt
